<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Interaktif - Blackbox AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        .input-group {
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #333;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .counter {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <h1>🎉 Welcome!</h1>
        <p class="subtitle">Coba fitur interaktif di bawah ini</p>
        
        <!-- Counter Section -->
        <div class="counter" id="counter">0</div>
        <button class="btn" onclick="incrementCounter()">+1</button>
        <button class="btn" onclick="resetCounter()">Reset</button>
        
        <!-- Input Section -->
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Masukkan nama kamu..." maxlength="20">
        </div>
        <button class="btn" onclick="greetUser()">Sapa Saya!</button>
        
        <!-- Result Section -->
        <div class="result" id="result"></div>
    </div>

    <script>
        // 1. Particle Animation
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // 2. Counter Functionality
        let counter = 0;
        const counterDisplay = document.getElementById('counter');

        function incrementCounter() {
            counter++;
            counterDisplay.textContent = counter;
            counterDisplay.style.color = `hsl(${counter % 360}, 70%, 50%)`;
            createPulseEffect();
        }

        function resetCounter() {
            counter = 0;
            counterDisplay.textContent = counter;
            counterDisplay.style.color = '#667eea';
        }

        // 3. Greeting Functionality
        function greetUser() {
            const nameInput = document.getElementById('nameInput');
            const result = document.getElementById('result');
            const name = nameInput.value.trim() || 'Teman';
            
            result.textContent = `Halo ${name}! 👋 Selamat datang di website interaktif ini!`;
            result.classList.add('show');
            
            // Auto hide result after 5 seconds
            setTimeout(() => {
                result.classList.remove('show');
            }, 5000);
            
            // Clear input
            nameInput.value = '';
            nameInput.focus();
        }

        // 4. Pulse Effect
        function createPulseEffect() {
            const pulse = document.createElement('div');
            pulse.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                width: 100px;
                height: 100px;
                background: radial-gradient(circle, rgba(102,126,234,0.3), transparent);
                border-radius: 50%;
                transform: translate(-50%, -50%) scale(0);
                z-index: 1000;
                animation: pulse 0.6s ease-out forwards;
                pointer-events: none;
            `;
            document.body.appendChild(pulse);
            
            setTimeout(() => {
                pulse.remove();
            }, 600);
        }

        // 5. Event Listeners
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                greetUser();
            }
        });

        // Initialize
        createParticles();
        document.getElementById('nameInput').focus();

        // Smooth scroll effect for mobile
        document.addEventListener('DOMContentLoaded', function() {
            // Add smooth scrolling for all links
            const links = document.querySelectorAll('a[href^="#"]');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });
        });
    </script>
</body>
</html>
